<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./script.js "></script>
</head>

<body>
    <main>
        <p id="rounds">First to 5 wins the game</p>
        <div id="choice">
            <p class="computer-choice">Computer choice</p>
            <p class="player-choice">Player choice</p>
        </div>
        <p id="round-result">Click one of the icons</p>
        <div id="scores">
            <p class="player-score">Player:0</p>
            <p class="computer-score">Computer:0</p>
        </div>
        <div id="buttons">
            <div class="scissors button"><img src="./imgs/scissors.png" alt="Scissors"></div>
            <div class="rock button"><img src="./imgs/rock.png" alt="Rock"></div>
            <div class="paper button"><img src="./imgs/paper.png" alt="Paper"></div>
        </div>
    </main>

</body>

</html>
